name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lua syntax (WoW runs Lua 5.1)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # The Ubuntu mirror sometimes fails to resolve; retry before failing the PR.
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -qq && timeout 180 sudo apt-get install -y -qq lua5.1 >/dev/null; then
              break
            fi
            if [ "$attempt" = 3 ]; then echo "apt-get lua5.1 failed after 3 tries"; exit 1; fi
            echo "apt-get attempt $attempt failed; retrying in 15s"; sleep 15
          done
          # Check every file; a syntax error in any of them fails the step.
          for f in *.lua; do
            luac5.1 -p "$f"
            echo "ok $f"
          done

      - name: Bindings.xml is well-formed
        if: ${{ !cancelled() }}
        run: python3 -c "import xml.dom.minidom as m; m.parse('Bindings.xml'); print('ok Bindings.xml')"

      - name: Nobody typed a version number
        if: ${{ !cancelled() }}
        run: |
          if ! grep -qx '## Version: @project-version@' LootBlacklist.toc; then
            echo "::error file=LootBlacklist.toc::Keep '## Version: @project-version@'. The Release workflow picks the version from git tags."
            exit 1
          fi
          echo "ok version placeholder"

      - name: Every TOC file ships
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          for f in $(grep -vE '^\s*(#|$)' LootBlacklist.toc | tr -d '\r'); do
            grep -q "\"$f\"" Install.ps1 || { echo "::error::$f is in the TOC but not in Install.ps1"; exit 1; }
            grep -q "$f" .github/workflows/release.yml || { echo "::error::$f is in the TOC but not in SHIPPED in release.yml"; exit 1; }
          done
          echo "ok shipped files"
